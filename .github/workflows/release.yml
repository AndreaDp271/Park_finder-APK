name: Release

# A ogni tag vX.Y.Z: APK firmato pubblicato nella pagina Releases come ParkMap-X.Y.Z.apk.
# L'app controlla questa pagina per gli aggiornamenti e la web app vi rimanda per il download Android.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "storeType=pkcs12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-parkmap}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > keystore.properties
      - name: Test
        run: ./gradlew testDebugUnitTest
      - name: Build
        run: ./gradlew assembleRelease
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "ParkMap-$VERSION.apk"
          NOTES="fastlane/metadata/android/it-IT/changelogs/$CODE.txt"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$GITHUB_REF_NAME" "ParkMap-$VERSION.apk" --title "ParkMap $VERSION" --notes-file "$NOTES"
      - name: Pulizia
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" keystore.properties
